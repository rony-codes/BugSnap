
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugSnap | Session Report</title>

  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: #e5e7eb;
      background: #0b1120;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top left, #172554 0, transparent 38%),
        #0b1120;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }

    header, .section-heading, .event-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    header { margin-bottom: 28px; }

    .brand {
      color: #fff;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    .brand span { color: #60a5fa; }

    .eyebrow {
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(26px, 5vw, 38px);
      letter-spacing: -1px;
      margin: 0 0 10px;
      color: #f8fafc;
    }

    h2 { font-size: 19px; margin: 0; color: #f8fafc; }

    .subtitle {
      color: #94a3b8;
      line-height: 1.6;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .panel {
      background: rgba(15, 23, 42, .9);
      border: 1px solid #263449;
      border-radius: 16px;
      padding: 22px;
      margin-top: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .16);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      background: #111c30;
      border: 1px solid #263449;
      padding: 16px;
      border-radius: 12px;
      min-width: 0;
    }

    .stat-label { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .stat-value { font-size: 25px; font-weight: 750; color: #f8fafc; overflow-wrap: anywhere; }

    .section-heading { margin-bottom: 22px; }

    .button {
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 650;
      padding: 11px 15px;
      cursor: pointer;
    }

    .button:hover { background: #3b82f6; }
    .button:disabled { opacity: .5; cursor: not-allowed; }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 24px;
    }

    .legend-item { display: flex; align-items: center; gap: 7px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .green { background: #22c55e; }
    .red { background: #ef4444; }

    .timeline { position: relative; padding-left: 32px; }

    .timeline::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: #263449;
    }

    .event {
      position: relative;
      margin-bottom: 18px;
      padding: 17px;
      border: 1px solid #263449;
      border-radius: 12px;
      background: #111c30;
      min-width: 0;
    }

    .event:last-child { margin-bottom: 0; }

    .event-marker {
      position: absolute;
      left: -32px;
      top: 22px;
      width: 16px;
      height: 16px;
      border: 3px solid #0b1120;
      border-radius: 50%;
    }

    .event.step .event-marker { background: #22c55e; }
    .event.error .event-marker { background: #ef4444; }

    .event-type {
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .event.step .event-type { color: #4ade80; }
    .event.error .event-type { color: #f87171; }
    .timestamp { color: #94a3b8; font-size: 12px; }

    .target {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      color: #93c5fd;
      font-size: 13px;
      overflow-wrap: anywhere;
      margin-bottom: 10px;
    }

    .detail {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .selector {
      color: #94a3b8;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }

    .empty {
      color: #94a3b8;
      text-align: center;
      padding: 28px 10px;
      line-height: 1.7;
    }

    .message {
      color: #cbd5e1;
      line-height: 1.7;
      overflow-wrap: anywhere;
      margin-top: 14px;
    }

    .message.error-text { color: #fca5a5; }

    .session-id {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
      color: #93c5fd;
      margin-top: 8px;
    }

    footer { color: #64748b; text-align: center; font-size: 12px; margin-top: 26px; }

    @media (max-width: 560px) {
      .container { padding: 24px 14px 40px; }
      .summary { grid-template-columns: 1fr; }
      .panel { padding: 16px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="brand">🐞 Bug<span>Snap</span></div>
      <button id="copyButton" class="button" disabled>Copy Markdown</button>
    </header>

    <div class="eyebrow">Session report</div>
    <h1>Steps to Reproduce</h1>
    <p class="subtitle">
      A simplified sequence of recorded interactions for reproducing an issue.
    </p>
    <div id="sessionId" class="session-id"></div>

    <section class="panel">
      <div class="summary">
        <div class="stat">
          <div class="stat-label">Recorded events</div>
          <div class="stat-value" id="totalCount">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Reproduction steps</div>
          <div class="stat-value" id="stepCount">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Console errors</div>
          <div class="stat-value" id="errorCount">—</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Reproduction steps</h2>
        <span id="timelineStatus" class="subtitle">Loading session…</span>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="dot green"></span>User interaction</div>
        <div class="legend-item"><span class="dot red"></span>Console error</div>
      </div>

      <div id="timeline" class="timeline">
        <div class="empty">Loading recorded events…</div>
      </div>

      <div id="pageMessage" class="message" role="status"></div>
    </section>

    <footer>Generated by BugSnap</footer>
  </main>

  <script>
    const sessionId = decodeURIComponent(
      window.location.pathname.split("/").pop()
    );

    const timeline = document.getElementById("timeline");
    const timelineStatus = document.getElementById("timelineStatus");
    const pageMessage = document.getElementById("pageMessage");
    const copyButton = document.getElementById("copyButton");

    let session = null;
    let events = [];
    let steps = [];

    function isConsoleError(event) {
      const type = String(event.eventType || event.type || "").toLowerCase();

      return [
        "console_error",
        "console.error",
        "uncaught_error",
        "javascript_error"
      ].includes(type);
    }

    function getDetails(event) {
      return event.details && typeof event.details === "object"
        ? event.details
        : {};
    }

    function formatTimestamp(value) {
      if (!value) return "Time unavailable";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
    }

    function addText(parent, tag, className, value) {
      const element = document.createElement(tag);
      element.className = className;
      element.textContent = value;
      parent.appendChild(element);
      return element;
    }

    function getDescription(event) {
      const details = getDetails(event);
      const type = String(event.eventType || "").toLowerCase();
      const name = details.elementName || event.targetElement || "element";

      if (details.description) return details.description;

      if (type === "recording_started") return null;

      if (type === "click_link") return `Clicked the "${name}" link`;
      if (type === "click") {
        const target = event.targetElement || "element";

        if (target === "button") return `Clicked the "${name}" button`;
        if (target === "link") return `Clicked the "${name}" link`;
        if (target === "checkbox") return `Interacted with the "${name}" checkbox`;

        // Ignore generic clicks that don't help reproduce a bug.
        return null;
      }

      if (type === "input") {
        return `Entered text in the "${name}" field`;
      }

      if (type === "change") {
        if (typeof details.checked === "boolean") {
          return details.checked
            ? `Selected "${name}"`
            : `Unselected "${name}"`;
        }

        return `Changed the selection in "${name}"`;
      }

      // Ignore unrecognized events rather than inventing a step.
      return null;
    }

    function buildSteps() {
      const output = [];
      const seen = new Set();

      for (const event of events) {
        if (isConsoleError(event)) {
          output.push({
            kind: "error",
            event,
            description: getDetails(event).message ||
              getDetails(event).error ||
              "Console error captured."
          });
          continue;
        }

        const description = getDescription(event);
        if (!description) continue;

        const details = getDetails(event);
        const key = [
          event.eventType,
          description,
          details.selector || "",
          details.url || ""
        ].join("|");

        // Suppress immediately repeated identical actions.
        const previous = output[output.length - 1];
        if (previous && previous.kind === "step" && previous.key === key) {
          continue;
        }

        if (seen.has(key) && event.eventType === "recording_started") {
          continue;
        }

        seen.add(key);
        output.push({
          kind: "step",
          event,
          description,
          key
        });
      }

      return output;
    }

    function renderTimeline() {
      timeline.replaceChildren();

      steps = buildSteps();

      document.getElementById("totalCount").textContent = events.length;
      document.getElementById("stepCount").textContent =
        steps.filter(item => item.kind === "step").length;
      document.getElementById("errorCount").textContent =
        steps.filter(item => item.kind === "error").length;

      if (!steps.length) {
        addText(
          timeline,
          "div",
          "empty",
          "No useful interactions were recorded. Try recording a few clicks and field interactions."
        );
        timelineStatus.textContent = "0 steps";
        return;
      }

      let stepNumber = 0;

      steps.forEach(item => {
        const { event, description } = item;
        const isError = item.kind === "error";

        if (!isError) stepNumber++;

        const card = document.createElement("article");
        card.className = `event ${isError ? "error" : "step"}`;

        const marker = document.createElement("span");
        marker.className = "event-marker";
        marker.setAttribute("aria-hidden", "true");
        card.appendChild(marker);

        const top = document.createElement("div");
        top.className = "event-top";

        addText(
          top,
          "span",
          "event-type",
          isError ? "Console error" : `Step ${stepNumber}`
        );

        addText(top, "time", "timestamp", formatTimestamp(event.timestamp));
        card.appendChild(top);

        addText(
          card,
          "div",
          "detail",
          isError ? description : `${stepNumber}. ${description}`
        );

        const details = getDetails(event);

        if (details.selector) {
          addText(card, "div", "selector", `Selector: ${details.selector}`);
        }

        timeline.appendChild(card);
      });

      timelineStatus.textContent =
        `${steps.filter(item => item.kind === "step").length} steps`;
    }

    function markdownEscape(value) {
      return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/([`*_{}\[\]<>\|])/g, "\\$1")
        .replace(/\r?\n/g, " ");
    }


function generateMarkdown() {
        const url = steps
          .map(item => getDetails(item.event).url)
          .find(Boolean);

        const lines = [
          "# BugSnap — Bug Report",
          "",
          `- **Session ID:** \`${markdownEscape(session.sessionId || sessionId)}\``,
          `- **Created:** ${markdownEscape(formatTimestamp(session.createdAt))}`,
          ...(url ? [`- **Page:** ${markdownEscape(url)}`] : []),
          "",
          "## Steps to Reproduce",
          ""
        ];

        let number = 0;

        for (const item of steps) {
          if (item.kind !== "step") continue;

          number++;
          lines.push(`${number}. ${markdownEscape(item.description)}`);
        }

        if (number === 0) {
          lines.push("_No useful interaction steps were captured._");
        }

        lines.push(
          "",
          "## Expected Result",
          "",
          "[Describe what should happen]",
          "",
          "## Actual Result",
          "",
          "[Describe what actually happened]"
        );

        const errors = steps.filter(item => item.kind === "error");

        if (errors.length) {
          lines.push("", "## Console Errors", "");

          errors.forEach(item => {
            lines.push(`- ${markdownEscape(item.description)}`);
          });
        }

        lines.push(
          "",
          "## Notes",
          "",
          "- Typed field values are not included in this report.",
          "- Review the reproduction steps before submitting.",
          "",
          "---",
          "_Generated by BugSnap_"
        );

        return lines.join("\n");
      }


    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(generateMarkdown());
        copyButton.textContent = "Copied!";
        pageMessage.className = "message";
        pageMessage.textContent = "Markdown copied to clipboard.";
        setTimeout(() => copyButton.textContent = "Copy Markdown", 1800);
      } catch (error) {
        pageMessage.className = "message error-text";
        pageMessage.textContent = "Clipboard access failed. Try copying from a secure browser context.";
        console.error("[BugSnap] Clipboard error:", error);
      }
    });

    async function loadSession() {
      try {
        if (!sessionId || sessionId === "report") {
          throw new Error("No session ID was provided in the URL.");
        }

        const response = await fetch(
          `/api/sessions/${encodeURIComponent(sessionId)}`
        );

        if (!response.ok) {
          throw new Error(`Could not load session (HTTP ${response.status}).`);
        }

        const data = await response.json();

        if (data.success === false) {
          throw new Error(data.message || "Session not found.");
        }

        session = data.session || data;

        if (!Array.isArray(session.events)) {
          throw new Error("The API response does not contain a session events array.");
        }

        events = session.events;
        copyButton.disabled = false;
        renderTimeline();
      } catch (error) {
        timeline.replaceChildren();
        addText(timeline, "div", "empty", error.message || "Unable to load session.");
        timelineStatus.textContent = "Unable to load";
        pageMessage.className = "message error-text";
        pageMessage.textContent = "Check the session ID and backend connection.";
        console.error("[BugSnap] Report loading failed:", error);
      }
    }

    document.getElementById("sessionId").textContent = "Session ID: " + sessionId;
    loadSession();
  </script>
</body>
</html>
